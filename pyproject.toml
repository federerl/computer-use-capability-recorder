[project]
name = "capability-recorder"
version = "0.1.0"
description = "LLM-discovered, deterministically replayable UI capabilities for legacy back-office apps"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "playwright>=1.47",
    "pydantic>=2.9",
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
