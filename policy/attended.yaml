name: attended
description: >
  The default for replay. Irreversible actions stop and ask for a person, even
  when the capability itself neglected to mark the step. The gate and the
  artifact are independent layers on purpose: a recording that forgets is
  exactly the case a guardrail exists for.

allowlist:
  origins:
    - http://127.0.0.1:5000
    - http://127.0.0.1:5099
    - http://127.0.0.1:5097
  paths:
    - "^/$"
    - "^/login$"
    - "^/logout$"
    - "^/members(/.*)?$"
    - "^/stoppay(/.*)?$"
  deny_paths:
    - "^/_control(/.*)?$"
    - "^/admin(/.*)?$"

action_types:
  allow: [click, fill, select, press, navigate]
  deny: [upload, download, accept_unknown_dialog]

risk_rules:
  - actions: [click]
    name_matches: "(?i)\\b(submit|confirm|approve|post|authorise|authorize)\\b"
    risk: irreversible
    on_risky: require_confirmation
    why: commits a servicing action that cannot be undone from the same screen
  - actions: [click]
    name_matches: "(?i)\\b(transfer|wire|disburse|close account|delete|remove|void)\\b"
    risk: irreversible
    on_risky: block
    why: moves money or destroys a record, and no capability here should do either

redaction:
  patterns:
    - "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    - "\\b(?:\\d[ -]?){13,19}\\b"
  screenshot_mask:
    - role: textbox
      name_matches: "(?i)(ssn|social security|tax id|card|password|pin)"
